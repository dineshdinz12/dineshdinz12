name: Update README stats cards
on:
  schedule:
    - cron: "0 3 * * *"   # daily at 3 AM UTC
  workflow_dispatch:        # lets you trigger it manually too
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=dineshdinz12&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&hide_title=true&bg_color=0a0a0a&title_color=D4AF37&icon_color=D4AF37&text_color=C9C9C9
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=dineshdinz12&layout=compact&langs_count=8&hide_border=true&hide_title=true&bg_color=0a0a0a&title_color=D4AF37&text_color=C9C9C9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update stats cards" || exit 0
          git push
